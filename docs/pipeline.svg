<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 830" width="760" height="830" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="830" fill="#ffffff"/>
