<style>.t{font-size:14px;font-weight:600}.s{font-size:12px}.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g text{fill:#2C2C2A}.te rect{fill:#E1F5EE;stroke:#0F6E56}.te .t{fill:#085041}.te .s{fill:#0F6E56}.co rect{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#712B13}.co .s{fill:#993C1D}.pu rect{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#3C3489}.pu .s{fill:#534AB7}rect{stroke-width:1}line,path.l{stroke:#5F5E5A;stroke-width:1.2;fill:none}</style>
<g class="g"><rect x="146" y="20" width="300" height="40" rx="8"/><text class="t" x="296" y="45" text-anchor="middle">User question</text></g>
