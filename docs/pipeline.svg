<text class="s" x="296" y="548" text-anchor="middle" fill="#5F5E5A">shape check: a result keyed by the wrong unit (players for "which season?")</text>
<text class="s" x="296" y="566" text-anchor="middle" fill="#5F5E5A">or a writer that can't answer moves on to the next program</text>
