[project]
name = "cricrag"
version = "0.1.0"
description = "Agentic hybrid retrieval (BM25 + dense + rerank) over IPL commentary, built on the cricbot archive"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "lancedb>=0.25",
  "pyarrow>=16",
  "numpy>=1.26",
  "fastembed>=0.5",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "cricdata>=0.3.2",        # cricbot's match pages: ESPN commentary and cross-check (optional at runtime)
  "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "pre-commit>=3.7"]

[project.scripts]
cricrag = "cricrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricrag"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["models: needs the real embedding/rerank models (downloads ~150 MB)"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
